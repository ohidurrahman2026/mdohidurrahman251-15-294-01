<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Problems - Week 6 to Week 13</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222
}

header{
    background:#24292f;
    color:white;
    text-align:center;
    padding:30px 15px
}

header h1{
    margin:0;
    font-size:30px
}

header p{
    margin-top:8px;
    color:#c9d1d9
}

.container{
    width:94%;
    max-width:1200px;
    margin:30px auto
}

.week{
    margin-bottom:35px
}

.week-title{
    background:#0969da;
    color:white;
    padding:15px 20px;
    border-radius:8px 8px 0 0;
    font-size:23px;
    font-weight:bold
}

.problem{
    background:white;
    margin-bottom:18px;
    overflow:hidden;
    border-radius:0 0 8px 8px;
    box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.problem-title{
    background:#e9edf2;
    padding:15px 20px;
    font-size:18px;
    font-weight:bold
}

pre{
    margin:0;
    padding:20px;
    background:#0d1117;
    color:#e6edf3;
    overflow-x:auto;
    font-size:14px;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word
}

code{
    font-family:Consolas,"Courier New",monospace
}

.loading{
    color:#8b949e
}

.error{
    color:#ff7b72;
    padding:15px
}

footer{
    text-align:center;
    padding:25px;
    color:#666
}
</style>
</head>

<body>

<header>
<h1>Java Programming Problems</h1>
<p>Week 6 - Week 13</p>
</header>

<div class="container" id="content"></div>

<footer>
Java Programming Practice
</footer>

<script>

const OWNER = "ohidurrahman2026";
const REPO = "mdohidurrahman251-15-294-01";
const BRANCH = "main";

const weeks = [
    "Week 6",
    "Week 7",
    "Week 8",
    "Week 9",
    "Week 11",
    "Week 12",
    "Week 13"
];

const content = document.getElementById("content");

async function getFolder(path){

    const url =
        https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(path)}?ref=${BRANCH};

    const response = await fetch(url);

    if(!response.ok){
        throw new Error("Folder not found");
    }

    return await response.json();
}

async function getCode(downloadUrl){

    const response = await fetch(downloadUrl);

    if(!response.ok){
        throw new Error("Code could not be loaded");
    }

    return await response.text();
}

function createWeek(name){

    const section = document.createElement("section");
    section.className = "week";

    const title = document.createElement("div");
    title.className = "week-title";
    title.textContent = name;

    section.appendChild(title);

    const box = document.createElement("div");
    section.appendChild(box);

    content.appendChild(section);

    return box;
}

async function loadWeek(weekName){

    const box = createWeek(weekName);

    box.innerHTML =
        '<div class="problem">' +
        '<pre class="loading">Loading...</pre>' +
        '</div>';

    try{

        const files = await getFolder(weekName);

        const javaFiles = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".java")
        );

        box.innerHTML = "";

        if(javaFiles.length === 0){

            box.innerHTML =
                '<div class="problem">' +
                '<pre class="error">No Java files found.</pre>' +
                '</div>';

            return;
        }

        javaFiles.sort((a,b) =>
            a.name.localeCompare(
                b.name,
                undefined,
                {numeric:true}
            )
        );

        for(let i=0;i<javaFiles.length;i++){

            const file = javaFiles[i];

            const problem =
                document.createElement("div");

            problem.className = "problem";

            const title =
                document.createElement("div");

            title.className = "problem-title";

            title.textContent =
                ${i+1}. ${file.name};

            const pre =
                document.createElement("pre");

            const code =
                document.createElement("code");

            code.textContent = "Loading...";

            pre.appendChild(code);
            problem.appendChild(title);
            problem.appendChild(pre);
            box.appendChild(problem);

            try{

                const source =
                    await getCode(file.download_url);

                code.textContent = source;

            }catch(error){

                code.textContent =
                    "Unable to load this code.";
            }
        }

    }catch(error){

        box.innerHTML =
            '<div class="problem">' +
            '<pre class="error">' +
            'Could not load ' +
            weekName +
            '.' +
            '</pre>' +
            '</div>';
    }
}

async function loadAll(){

    for(const week of weeks){
        await loadWeek(week);
    }
}

loadAll();

</script>

</body>
</html>
