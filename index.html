<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Java Programming Problems</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#24292f;
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
    color:#c9d1d9;
}

.container{
    width:94%;
    max-width:1100px;
    margin:30px auto;
}

.week{
    background:white;
    margin-bottom:20px;
    border-radius:9px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.week-title{
    background:#0969da;
    color:white;
    padding:16px 20px;
    font-size:21px;
    font-weight:bold;
}

.problem{
    border-top:1px solid #ddd;
}

.problem-title{
    padding:14px 18px;
    background:#f6f8fa;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.problem-title:hover{
    background:#eaeef2;
}

.code{
    display:none;
    background:#0d1117;
}

pre{
    margin:0;
    padding:20px;
    color:#e6edf3;
    font-family:Consolas,"Courier New",monospace;
    font-size:14px;
    line-height:1.6;
    overflow-x:auto;
    white-space:pre-wrap;
}

.loading{
    padding:20px;
    color:#8b949e;
}

.error{
    padding:20px;
    color:#ff7b72;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}

</style>
</head>

<body>

<header>

<h1>Java Programming Problems</h1>

<p>
Week 6 - Week 13
</p>

</header>


<div class="container" id="content">

<div class="loading">
Loading Java problems...
</div>

</div>


<footer>
Java Programming Practice
</footer>


<script>

/* =====================================================
   GITHUB REPOSITORY
===================================================== */

const OWNER = "ohidurrahman2026";

const REPO = "mdohidurrahman251-15-294-01";

const BRANCH = "main";


/* =====================================================
   WEEKS
===================================================== */

const weeks = [
    6,
    7,
    8,
    9,
    11,
    12,
    13
];


/* =====================================================
   GET ALL FILES FROM REPOSITORY
===================================================== */

async function getRepositoryFiles(){

    const url =
        https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1;

    const response = await fetch(url);

    if(!response.ok){

        throw new Error(
            "GitHub repository could not be accessed."
        );

    }

    const data = await response.json();

    return data.tree.filter(file =>

        file.type === "blob" &&

        file.path.toLowerCase().endsWith(".java")

    );

}


/* =====================================================
   FIND WEEK NUMBER FROM FILE PATH
===================================================== */

function getWeekNumber(path){

    const lower = path.toLowerCase();

    const patterns = [

        /week[\s_-]*(\d+)/i,

        /wk[\s_-]*(\d+)/i

    ];

    for(const pattern of patterns){

        const match = lower.match(pattern);

        if(match){

            return Number(match[1]);

        }

    }

    return null;

}


/* =====================================================
   CREATE WEEK
===================================================== */

function createWeek(weekNumber){

    const section =
        document.createElement("section");

    section.className = "week";


    const title =
        document.createElement("div");

    title.className = "week-title";

    title.textContent =
        "Week " + weekNumber;


    section.appendChild(title);


    const problems =
        document.createElement("div");


    section.appendChild(problems);


    document
        .getElementById("content")
        .appendChild(section);


    return problems;

}


/* =====================================================
   CREATE PROBLEM
===================================================== */

function createProblem(
    file,
    number,
    parent
){

    const problem =
        document.createElement("div");

    problem.className =
        "problem";


    const title =
        document.createElement("div");

    title.className =
        "problem-title";


    title.textContent =
        number + ". " + file.path;


    const codeBox =
        document.createElement("div");

    codeBox.className =
        "code";


    const loading =
        document.createElement("div");

    loading.className =
        "loading";

    loading.textContent =
        "Loading code...";


    codeBox.appendChild(
        loading
    );


    title.onclick =
        async function(){

        if(
            codeBox.style.display ===
            "block"
        ){

            codeBox.style.display =
                "none";

            return;

        }


        codeBox.style.display =
            "block";


        try{

            const rawURL =
                `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${file.path
                    .split("/")
                    .map(encodeURIComponent)
                    .join("/")}`;


            const response =
                await fetch(rawURL);


            if(!response.ok){

                throw new Error(
                    "Code could not be loaded."
                );

            }


            const code =
                await response.text();


            codeBox.innerHTML =
                "";


            const pre =
                document.createElement("pre");


            pre.textContent =
                code;


            codeBox.appendChild(
                pre
            );


        }
        catch(error){

            codeBox.innerHTML =
                <div class="error">${error.message}</div>;

        }

    };


    problem.appendChild(
        title
    );

    problem.appendChild(
        codeBox
    );


    parent.appendChild(
        problem
    );

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadPage(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = "";


    try{

        const files =
            await getRepositoryFiles();


        for(
            const weekNumber of weeks
        ){

            const weekFiles =
                files.filter(
                    file =>
                        getWeekNumber(
                            file.path
                        ) === weekNumber
                );


            const problems =
                createWeek(
                    weekNumber
                );


            weekFiles.sort(
                (a,b) =>
                    a.path.localeCompare(
                        b.path,
                        undefined,
                        {
                            numeric:true
                        }
                    )
            );


            if(
                weekFiles.length === 0
            ){

                problems.innerHTML =
                    `<div class="error">
                        No Java files found for Week ${weekNumber}.
                    </div>`;

                continue;

            }


            weekFiles.forEach(
                (file,index) => {

                    createProblem(
                        file,
                        index + 1,
                        problems
                    );

                }
            );

        }

    }
    catch(error){

        content.innerHTML =
            `<div class="error">
                ${error.message}
            </div>`;

    }

}


loadPage();

</script>

</body>
</html>
