<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Java Problems - Md. Ohidur Rahman</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: #24292f;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    color: #c9d1d9;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 25px auto;
}

/* WEEK */
.week {
    background: white;
    margin-bottom: 15px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.week-title {
    background: #0969da;
    color: white;
    padding: 17px 20px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.week-title:hover {
    background: #0757b5;
}

.problems {
    display: none;
    padding: 15px;
}

/* PROBLEM */
.problem {
    border: 1px solid #d0d7de;
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
}

.problem-title {
    background: #f6f8fa;
    padding: 14px 16px;
    font-weight: bold;
    cursor: pointer;
}

.problem-title:hover {
    background: #eaeef2;
}

/* CODE */
.code-container {
    display: none;
    background: #0d1117;
}

pre {
    margin: 0;
    padding: 18px;
    color: #e6edf3;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
}

.loading {
    padding: 15px;
    color: #57606a;
}

.error {
    padding: 15px;
    color: #cf222e;
    background: #ffebe9;
}

footer {
    text-align: center;
    padding: 30px;
    color: #57606a;
}
</style>
</head>

<body>

<header>
    <h1>Java Programming Problems & Solutions</h1>
    <p>Md. Ohidur Rahman | ID: 251-15-294-01</p>
</header>

<div class="container" id="content">
    <div class="loading">Loading...</div>
</div>

<footer>
    Java Programming Practice
</footer>


<script>

/* =====================================================
   GITHUB INFORMATION
   ===================================================== */

const OWNER = "ohidurrahman2026";
const REPO = "mdohidurrahman251-15-294-01";
const BRANCH = "main";


/* =====================================================
   YOUR WEEKS
   ===================================================== */

const weeks = [
    "Week 6",
    "Week 7",
    "Week 8",
    "Week 9",
    "Week 11",
    "Week 12",
    "Week 13"
];


/* =====================================================
   GITHUB API
   ===================================================== */

function apiURL(path) {

    return "https://api.github.com/repos/" +
        OWNER +
        "/" +
        REPO +
        "/contents/" +
        path.split("/")
            .map(encodeURIComponent)
            .join("/") +
        "?ref=" +
        BRANCH;
}


/* =====================================================
   GET FOLDER CONTENT
   ===================================================== */

async function getFolder(path) {

    const response = await fetch(apiURL(path));

    if (!response.ok) {
        throw new Error(
            "Cannot access folder: " + path
        );
    }

    return await response.json();
}


/* =====================================================
   GET JAVA CODE
   ===================================================== */

async function getJavaCode(path) {

    const url =
        "https://raw.githubusercontent.com/" +
        OWNER +
        "/" +
        REPO +
        "/" +
        BRANCH +
        "/" +
        path.split("/")
            .map(encodeURIComponent)
            .join("/");

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            "Cannot load file: " + path
        );
    }

    return await response.text();
}


/* =====================================================
   CREATE WEEK
   ===================================================== */

function createWeek(weekName) {

    const week = document.createElement("div");

    week.className = "week";

    const title = document.createElement("div");

    title.className = "week-title";

    title.textContent = weekName;

    const problems = document.createElement("div");

    problems.className = "problems";

    title.onclick = function() {

        if (problems.style.display === "block") {

            problems.style.display = "none";

        } else {

            problems.style.display = "block";

        }
    };

    week.appendChild(title);

    week.appendChild(problems);

    document
        .getElementById("content")
        .appendChild(week);

    return problems;
}


/* =====================================================
   CREATE PROBLEM
   ===================================================== */

function createProblem(
    fileName,
    filePath,
    parent
) {

    const problem =
        document.createElement("div");

    problem.className = "problem";


    const problemTitle =
        document.createElement("div");

    problemTitle.className =
        "problem-title";

    problemTitle.textContent =
        fileName;


    const codeContainer =
        document.createElement("div");

    codeContainer.className =
        "code-container";


    const loading =
        document.createElement("div");

    loading.className =
        "loading";

    loading.textContent =
        "Loading Java code...";


    codeContainer.appendChild(loading);


    problemTitle.onclick =
        async function() {

        if (
            codeContainer.style.display
            === "block"
        ) {

            codeContainer.style.display =
                "none";

            return;
        }


        codeContainer.style.display =
            "block";


        try {

            const code =
                await getJavaCode(filePath);


            codeContainer.innerHTML =
                "";


            const pre =
                document.createElement("pre");


            /*
               textContent is used here so the
               Java code is displayed exactly as
               code instead of being executed as HTML.
            */

            pre.textContent = code;


            codeContainer.appendChild(pre);


        } catch (error) {

            codeContainer.innerHTML = "";

            const errorBox =
                document.createElement("div");

            errorBox.className =
                "error";

            errorBox.textContent =
                error.message;

            codeContainer.appendChild(
                errorBox
            );
        }
    };


    problem.appendChild(
        problemTitle
    );

    problem.appendChild(
        codeContainer
    );

    parent.appendChild(
        problem
    );
}


/* =====================================================
   LOAD ONE WEEK
   ===================================================== */

async function loadWeek(weekName) {

    const problems =
        createWeek(weekName);


    try {

        const files =
            await getFolder(weekName);


        const javaFiles =
            files.filter(function(file) {

                return (
                    file.type === "file" &&
                    file.name
                        .toLowerCase()
                        .endsWith(".java")
                );

            });


        javaFiles.sort(function(a, b) {

            return a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            );

        });


        if (javaFiles.length === 0) {

            problems.innerHTML =
                '<div class="error">' +
                'No Java files found in this Week.' +
                '</div>';

            return;
        }


        javaFiles.forEach(function(file) {

            createProblem(
                file.name,
                file.path,
                problems
            );

        });


    } catch (error) {

        problems.innerHTML = "";

        const errorBox =
            document.createElement("div");

        errorBox.className =
            "error";

        errorBox.innerHTML =
            "Could not load <b>" +
            weekName +
            "</b>.<br><br>" +
            "Check that the folder name in " +
            "GitHub is exactly: " +
            weekName;

        problems.appendChild(
            errorBox
        );
    }
}


/* =====================================================
   LOAD EVERYTHING
   ===================================================== */

async function loadAll() {

    const content =
        document.getElementById(
            "content"
        );

    content.innerHTML = "";


    for (
        const week of weeks
    ) {

        await loadWeek(week);

    }
}


/* START */

loadAll();

</script>

</body>
</html>
